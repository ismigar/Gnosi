packages:
  - frontend
  - desktop
  - tests/e2e

sharedWorkspaceLockfile: true

nodeVersion: 22.22.2
engineStrict: true
strictPeerDependencies: false
autoInstallPeers: true
strictDepBuilds: true
fetchRetries: 5
fetchRetryMintimeout: 20000
fetchRetryMaxtimeout: 120000
fetchTimeout: 300000
networkConcurrency: 8

# The Apache-licensed whiteboard imports these packages for its built-in poll shape.
packageExtensions:
  '@bigbluebutton/tldraw@2.0.0-alpha.36':
    dependencies:
      recharts: 3.11.0
      styled-components: 6.6.0

patchedDependencies:
  '@bigbluebutton/tldraw@2.0.0-alpha.36': patches/@bigbluebutton__tldraw@2.0.0-alpha.36.patch
  emscripten-wasm-loader@3.0.3: patches/emscripten-wasm-loader@3.0.3.patch

allowBuilds:
  # Electron 43 uses the explicit desktop install:runtime command.
  # core-js only prints a post-install funding message; no build is required.
  core-js: false
  electron: false
  # Squirrel.Windows is a transitive builder dependency; Gnosi ships NSIS.
  electron-winstaller: false
  esbuild: true
  # Supported desktop targets use Koffi's prebuilt Node-API artifacts only.
  koffi: false
