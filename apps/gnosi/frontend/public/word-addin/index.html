<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Gnosi Cite</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <!--
        Office.js is the client-side API for interacting with Word.
        Load it from the official CDN to receive automatic security updates;
        the client's Word version selects the appropriate build.
    -->
    <script src="https://appsforoffice.microsoft.com/lib/1.1/hosted/office.js"></script>
    <link rel="stylesheet" href="/word-addin/taskpane.css" />
</head>
<body>
    <header class="header">
        <div class="title">
            <span class="logo">G</span>
            <span>Gnosi Cite</span>
        </div>
        <div class="subtitle" id="connection-status">Connecting…</div>
    </header>

    <main class="main">
        <section class="search-section">
            <div class="search-bar">
                <input
                    type="text"
                    id="search-input"
                    placeholder="Search by citation key, title, or author…"
                    autocomplete="off"
                    autofocus
                />
            </div>
            <div class="style-row">
                <label for="style-select">Style:</label>
                <select id="style-select">
                    <option value="apa">APA 7</option>
                    <option value="chicago-author-date">Chicago (author-date)</option>
                    <option value="modern-language-association">MLA</option>
                    <option value="ieee">IEEE</option>
                </select>
            </div>
        </section>

        <section class="results-section">
            <ul id="results" class="results"></ul>
            <div id="empty-state" class="empty-state">
                Enter a term to search for references in the Vault.
            </div>
        </section>

        <section class="actions">
            <button id="insert-bibliography" class="btn btn-primary" type="button">
                Insert bibliography
            </button>
        </section>

        <!--
            Token settings. The add-in runs in an Office webview on its own
            origin, so a session cookie cannot reach it: a Personal Access Token
            is the only credential it can use once GNOSI_REQUIRE_AUTH is on.
            Collapsed by default — it is set once and then forgotten.
        -->
        <details class="settings" id="settings">
            <summary>Token settings</summary>
            <p class="settings-help">
                Create a token in Gnosi (Settings → API tokens) and paste it here.
                It is stored on this device only.
            </p>
            <div class="settings-row">
                <input
                    type="password"
                    id="token-input"
                    placeholder="gnosi_pat_…"
                    autocomplete="off"
                    spellcheck="false"
                />
                <button id="token-save" class="btn btn-primary" type="button">Save</button>
            </div>
            <div class="settings-row">
                <span id="token-state" class="settings-state">No token</span>
                <button id="token-clear" class="btn btn-secondary" type="button">Clear</button>
            </div>
        </details>
    </main>

    <footer class="footer">
        <span id="status-line">Ready</span>
    </footer>

    <script src="/word-addin/taskpane.js"></script>
</body>
</html>
