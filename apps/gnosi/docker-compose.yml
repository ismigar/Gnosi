services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: gnosi_backend
    # Hot-reload en desenvolupament: el codi del backend es munta com a
    # volum (`./backend:/app/backend`), però uvicorn sense `--reload`
    # només llegeix el codi a l'arrencada. Després d'un `git pull` calia
    # reiniciar el contenidor a mà o el procés seguia executant codi vell
    # (això va provocar que el fix del PATCH de dashboards no tingués
    # efecte fins a `docker restart`). Amb `--reload` + `--reload-dir`
    # limitat a `/app/backend`, uvicorn detecta els canvis del codi font
    # i es recarrega sol, sense vigilar `/vault` ni `/app/data` (que
    # tenen milers de fitxers i saturarien el watcher).
    command: uvicorn backend.server:app --host 0.0.0.0 --port 5002 --reload --reload-dir /app/backend
    ports:
      - "5002:5002"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Vault ACTIU al host. Per defecte el vault Principal de l'autor, però
      # overridable via VAULT_HOST_PATH al `.env` local → funciona amb un altre
      # núvol (Dropbox/iCloud/Drive) o sense núvol (carpeta local). Dins el
      # contenidor el vault SEMPRE és /vault, així que el codi és cloud-agnòstic.
      # MAI l'arrel …/OneDrive-UNED/Gnosi: des del multi-vault és el CONTENIDOR
      # de vaults (Principal/, Notion/, …) — muntar-la aquí fa que el backend
      # re-creï tota l'estructura (BD/, Mail/, Assets/…) a l'arrel de vaults.
      - ${VAULT_HOST_PATH:-$HOME/Library/CloudStorage/OneDrive-UNED/Gnosi/Principal}:/vault
      # CONTENIDOR de vaults sencer (multi-vault): els vaults germans del actiu
      # (p. ex. Gnosi/Notion, on el clon de Notion valida abans d'adoptar-se)
      # han de ser llegibles I escrivibles des del container. El backend hi crea
      # els vaults nous (GNOSI_VAULTS_ROOT, vegeu vaults_routes.py). Si canvies
      # VAULT_HOST_PATH al `.env`, defineix també VAULTS_ROOT_HOST_PATH
      # (típicament el directori pare del vault actiu).
      - ${VAULTS_ROOT_HOST_PATH:-$HOME/Library/CloudStorage/OneDrive-UNED/Gnosi}:/vaults
      # (La Biblioteca viu DINS de cada vault — vault-first pur, 2026-07-03 —
      # així que va pel mount rw del vault/vaults i no cal cap mount específic.)
      # $HOME is read-only: the backend reads project files (analytics scans
      # docs/dev_memory/directives, system /browse navigates user directories,
      # scratch_sync imports modules) but does not need to write outside the
      # vault, /app/backend and the named gnosi_local_data volume.
      - ${HOME}:${HOME}:ro
      # Only the agent mailbox archive needs write access (system_maintenance
      # task purges old messages). Scoped explicitly so a process inside the
      # container can't tamper with the rest of $HOME.
      - ${REPO_ROOT:-$HOME/Projectes}/.antigravity:${REPO_ROOT:-$HOME/Projectes}/.antigravity:rw
      - ${HOME}/.gnosi:/root/.gnosi:ro
      - ./backend:/app/backend
      # Credencials d'integracions (tokens Google, contrasenyes IMAP/SMTP)
      # editades via UI han de persistir entre rebuilds del container. La
      # resta de `pipeline/` queda a la imatge perquè és codi versionat;
      # només els secrets es mantenen al host (gitignored a apps/gnosi/.gitignore).
      - ./pipeline/private_skills/secrets:/app/pipeline/private_skills/secrets
      # Local-only data (SQLite, caches, indices). NEVER point at cloud-synced
      # storage — SQLite + cloud sync = corruption. See paths_config.py.
      - gnosi_local_data:/app/data
    # Rutes del host parametritzades: ${HOME} resol per màquina. Per usar un
    # altre núvol o cap, defineix al `.env` local (gitignored, auto-carregat per
    # compose) VAULT_HOST_PATH i VAULTS_ROOT_HOST_PATH (i opcionalment
    # GNOSI_FILES_PROVIDER=local|icloud|gdrive|nextcloud). ${REPO_ROOT} (arrel
    # del repo, per al mount de .antigravity) per defecte és $HOME/Projectes; si
    # el repo viu en una altra ubicació, defineix REPO_ROOT al mateix `.env`.
    env_file:
      - ../../../.env_shared # 1. Variables compartides
      - .env # 2. Variables locals (sobreescriuen) — opcional: REPO_ROOT
    environment:
      - LOGGING_LEVEL=debug
      # REQUIRED on this exposed deployment: a strong, private JWT signing secret.
      # Without it the backend refuses to start (it will not fall back to the
      # public dev secret, which would be an authentication bypass). Set it in
      # .env / .env_shared, e.g. GNOSI_JWT_SECRET=$(openssl rand -hex 32).
      - GNOSI_JWT_SECRET=${GNOSI_JWT_SECRET:?set GNOSI_JWT_SECRET to a strong random value}
      - DIGITAL_BRAIN_VAULT_PATH=/vault
      - VAULT_HOST_PATH=${VAULT_HOST_PATH:-$HOME/Library/CloudStorage/OneDrive-UNED/Gnosi/Principal}
      # Multi-vault: on són els vaults DINS del container (GNOSI_VAULTS_ROOT) i
      # al host (VAULTS_ROOT_HOST_PATH, per traduir /vaults/X → host als daemons).
      - GNOSI_VAULTS_ROOT=/vaults
      - VAULTS_ROOT_HOST_PATH=${VAULTS_ROOT_HOST_PATH:-$HOME/Library/CloudStorage/OneDrive-UNED/Gnosi}
      - HOME_HOST_PATH=${HOME}
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      # Variables calculades dinàmicament o especials
      - AI_MODEL_URL=http://host.docker.internal:11434/v1/chat/completions
      - TZ=Europe/Madrid
      # Captura web de referències (Zotero translation-server, sidecar).
      - TRANSLATION_SERVER_URL=http://translation-server:1969
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; urllib.request.urlopen('http://localhost:5002/api/health', timeout=3); sys.exit(0)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: gnosi_frontend
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/frontend/node_modules
    environment:
      - VITE_BACKEND_HOST=backend
      - VITE_BACKEND_PORT=5002
      - CHOKIDAR_USEPOLLING=true
      - TZ=Europe/Madrid
    depends_on:
      - backend
    restart: unless-stopped

  # Zotero translation-server: motor de captura web de referències (~700
  # traductors específics per web + resolució per identificador). El backend
  # l'utilitza via `POST /api/vault/translate-url` (xarxa interna de compose,
  # nom de servei `translation-server`). No s'exposa al host: només l'usa el
  # backend. Imatge oficial mantinguda per Zotero.
  translation-server:
    image: zotero/translation-server:latest
    container_name: gnosi_translation_server
    environment:
      - TZ=Europe/Madrid
    # Healthcheck: comprovem que el procés respon a TCP/HTTP, no que processi
    # cap URL externa concreta. El POST original a example.com retornava 400
    # (Zotero no té traductor per a aquesta pàgina) i wget marcava unhealthy
    # malgrat el servei estar viu. Amb --spider + grep HTTP/ acceptem qualsevol
    # status code (200, 404...) com a senyal de "procés escoltant".
    healthcheck:
      test: ["CMD-SHELL", "wget --server-response --spider --quiet --tries=1 --timeout=5 http://localhost:1969/ 2>&1 | grep -q 'HTTP/' || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  gnosi_local_data:
    driver: local
