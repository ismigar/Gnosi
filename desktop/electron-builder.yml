appId: com.gnosi.cervell-digital
productName: Gnosi
copyright: Copyright © 2026 Ismael Garcia Fernandez

directories:
  output: dist
  buildResources: assets

afterPack: scripts/after-pack.cjs

# A solid background keeps Finder's window at the configured logical size.
dmg:
  backgroundColor: '#f8fafc'
  title: ${productName}
  iconSize: 96
  window:
    width: 540
    height: 320
  contents:
    - x: 140
      y: 150
      type: file
    - x: 400
      y: 150
      type: link
      path: /Applications

files:
  - main.js
  - preload.js
  - ipc-security.js
  - ipc-handlers.js
  - backend-process.js
  - startup-errors.js
  - profile-startup.js
  - cookie-schema-guard.js
  - cookie-schema.js
  - cookie-profile-migration.js
  - cookie-migration.js
  - cookie-migration-files.js
  - cookie-rollback.js
  - profile-preservation.js
  - exclusive-rename.js
  - application-menu.js
  - help-links.json
  - backend-launch.js
  - release-version.js
  - update-policy.js
  - sparkle-updater.js
  # Runtime dependencies used by main.js (electron-log drives the auto-updater
  # logger; electron-updater is the updater itself). electron-builder follows
  # package.json dependencies, so only production deps land in the asar.
  - node_modules/**/*

# The fixed no-replace filesystem adapter uses prebuilt Node-API modules.
asarUnpack:
  - node_modules/koffi/**/*
  - node_modules/@koromix/**/*

extraResources:
  - from: ../frontend/dist/
    to: frontend/dist/
    filter:
      - "**/*"
      - "!**/*.map"
  - from: assets/
    to: assets/
    filter:
      - "**/*"
      # Icon assets are build-time inputs consumed by
      # electron-builder itself; they are not needed inside the packaged app.
      - "!icon.icns"
      - "!icon.ico"
      - "!icon.png"
  - from: dist-python/
    to: python
    filter:
      - "**/*"

mac:
  icon: assets/icon.icns
  category: public.app-category.productivity
  # The PyInstaller Python.framework has an ambiguous bundle type that breaks
  # electron-builder's internal --deep signing. We exclude it here and seal it
  # ad-hoc in after-pack.cjs (signing Versions/Current, the unambiguous form).
  signIgnore:
    - Contents/Resources/python/_internal/Python.framework
  target:
    # The release matrix passes --arm64 or --x64. Do not list both
    # architectures here: each frozen Python backend is host-native and must
    # be packaged only into its matching Electron application.
    - target: dmg
    - target: zip
  artifactName: ${productName}-${version}-${arch}.${ext}

linux:
  icon: assets/icon.png
  executableName: gnosi
  syncDesktopName: true
  target:
    - target: AppImage
    - target: deb
  category: Office
  artifactName: ${productName}-${version}-${arch}.${ext}

# Include the DEB in the same update channel so installed DEBs select their
# native package instead of the AppImage. Installation may ask for elevation.
deb:
  publish:
    provider: github
    owner: ismigar
    repo: Gnosi

win:
  icon: assets/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-${version}-Setup.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

publish:
  provider: github
  owner: ismigar
  repo: Gnosi
  releaseType: release

electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
