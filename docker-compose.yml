# Portable self-hosted bundle. Native Python + Vite remains the development default.
# Preserve the Compose project name when upgrading: it selects existing named volumes.
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    init: true
    ports:
      - "${GNOSI_BIND_ADDRESS:-127.0.0.1}:${GNOSI_BACKEND_PORT:-5002}:5002"
    volumes:
      - gnosi_local_data:/data
      - gnosi_vaults:/vaults
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      # Compose reads these on the host; neither file is mounted or baked in.
      - path: ${GNOSI_SHARED_ENV_FILE:-.env.shared.disabled}
        required: false
      - path: .env
        required: false
    environment:
      # Required independently of env_file, because Compose interpolates first.
      GNOSI_JWT_SECRET: ${GNOSI_JWT_SECRET:?set GNOSI_JWT_SECRET to a strong random value}
      GNOSI_REQUIRE_AUTH: "1"
      DIGITAL_BRAIN_VAULT_PATH: /vaults/default
      GNOSI_VAULTS_ROOT: /vaults
      GNOSI_DATA_DIR: /data
      PYTHONPATH: /app
      PYTHONUNBUFFERED: "1"
      # Shared values are already in the container process environment.
      GNOSI_SHARED_ENV_FILE: ""
      TRANSLATION_SERVER_URL: ${TRANSLATION_SERVER_URL-http://translation-server:1969}
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5002/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    init: true
    ports:
      - "${GNOSI_BIND_ADDRESS:-127.0.0.1}:${GNOSI_FRONTEND_PORT:-5173}:5173"
    environment:
      VITE_BACKEND_HOST: backend
      VITE_BACKEND_PORT: "5002"
      VITE_DEV_HTTPS: "false"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # Internal-only web-reference translation; no external URL is fetched by health checks.
  translation-server:
    image: ${GNOSI_TRANSLATION_IMAGE:-zotero/translation-server:latest}
    healthcheck:
      test: ["CMD-SHELL", "wget --server-response --spider --quiet --tries=1 --timeout=5 http://localhost:1969/ 2>&1 | grep -q 'HTTP/' || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  # Keep this key for upgrades; never prune it as a dependency repair.
  gnosi_local_data:
    driver: local
  gnosi_vaults:
    driver: local
