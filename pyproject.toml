[project]
name = "gnosi-runtime"
version = "3.0.0-rc.2"
description = "Python runtime for the Gnosi local-first knowledge workspace"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "aiosqlite>=0.22.1",
  "alembic>=1.19.1",
  "anthropic>=0.122.0",
  "bcrypt>=4.1",
  "beautifulsoup4>=4.15.0",
  "chromadb>=0.4.0",
  "cloudinary>=1.46.0",
  "cohere>=7.0.5",
  "cryptography>=48.0.1,<49.0.0; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "cryptography>=50.0.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
  "defusedxml>=0.7.1",
  "dotenv>=0.9.9",
  "ebooklib>=0.20",
  "email-validator==2.3.0",
  "faster-whisper>=1.2.1",
  "fastapi>=0.136.3",
  "feedparser>=6.0.14",
  "flask-cors>=4.0.0",
  "flask>=3.1.3",
  "google-api-python-client>=2.0.0",
  "google-auth-oauthlib>=1.4.0",
  "google-auth>=2.56.3",
  "groq>=0.37.1",
  "gtts>=2.5.0",
  "gunicorn>=26.0.0",
  "httpx>=0.28.1",
  "httplib2>=0.32.0",
  "icalendar>=7.2.2",
  "langchain-anthropic>=1.5.3",
  "langchain-chroma>=1.1.0",
  "langchain-groq>=1.1.3",
  "langchain-huggingface>=1.2.2",
  "langchain-ollama>=1.1.0",
  "langchain-openai>=1.4.2",
  "langchain>=1.3.15",
  "langgraph-checkpoint-sqlite>=3.1.1",
  "langgraph>=1.2.9",
  "keyring>=25.7.0",
  "networkx>=3.6.1",
  "numpy>=1.26.4,<2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "numpy>=1.26.4; sys_platform != 'darwin' or platform_machine != 'x86_64'",
  "pillow>=12.3.0",
  "psutil>=7.2.2",
  "py-spy>=0.3.14",
  "pydantic>=2.13.4",
  "pypdf>=6.16.1",
  "pypdfium2>=4.30.0",
  "python-docx>=1.1.0",
  "python-dotenv>=1.2.2",
  "python-igraph>=1.0.0",
  "python-jose[cryptography]>=3.5.0",
  "python-multipart>=0.0.32",
  "pyyaml>=6.0.3",
  "requests>=2.31.0",
  "sentence-transformers>=5.6.0",
  "sentencepiece>=0.2.2",
  "simpleeval>=1.0.7",
  "sqlalchemy>=2.0.51",
  "trafilatura>=2.2.0",
  "uvicorn[standard]>=0.51.0",
  "yt-dlp>=2025.1.15",
]

[dependency-groups]
dev = [
  "mypy>=1.18.2",
  "pytest-cov>=7.0.0",
  "pytest>=9.1.1",
  "ruff>=0.13.0",
  "types-defusedxml>=0.7.0.20260504",
  "types-networkx>=3.6.1.20260728",
  "types-psutil>=7.2.2.20260827",
  "types-python-dateutil>=2.9.0.20260807",
  "types-python-jose>=3.5.0.20260408",
  "types-pyyaml>=6.0.12.20260815",
]
desktop = [
  "pyinstaller>=6.16.0",
]
docs = [
  "mkdocs-material>=9.6,<10",
  "mkdocs>=1.6.1,<2",
  "pymdown-extensions>=11.0.1,<12",
]

[tool.uv]
package = false
default-groups = ["dev"]
required-environments = [
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
  "sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "sys_platform == 'linux' and platform_machine == 'aarch64'",
  "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[tool.uv.workspace]
members = ["extensions/mcp/drupal-proxy"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.pytest.ini_options]
testpaths = ["backend", "pipeline", "extensions", "desktop/tests"]
pythonpath = ["."]
addopts = "--strict-config --strict-markers"
