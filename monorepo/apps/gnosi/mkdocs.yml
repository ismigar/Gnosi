site_name: Gnosi Engineering Documentation
site_description: Architecture, implementation, operations, and source reference for Gnosi
site_url: https://gnosi.temenosismael.org/engineering/
repo_url: https://github.com/ismigar/Gnosi
repo_name: ismigar/Gnosi
edit_uri: edit/main/apps/gnosi/docs/engineering/
docs_dir: docs/engineering
site_dir: site/engineering
strict: true

theme:
  name: material
  custom_dir: docs/engineering-overrides
  language: en
  features:
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: teal

nav:
  - Start here: index.md
  - Product:
      - Purpose and scope: product/purpose-and-scope.md
      - Terminology: product/terminology.md
  - Architecture:
      - System context: architecture/system-context.md
      - Runtime and deployment: architecture/runtime-and-deployment.md
      - Data and storage: architecture/data-and-storage.md
      - Cross-cutting flows: architecture/cross-cutting-flows.md
  - Domains:
      - Platform foundation and runtime: domains/foundation-runtime.md
      - Vault and files: domains/vault-files.md
      - Database views and planning: domains/database-views-planning.md
      - Knowledge graph: domains/knowledge-graph.md
      - Reader, references, and citations: domains/reader-references.md
      - Grounded notebooks: domains/notebooks.md
      - AI agents, models, tools, and skills: domains/ai-agent.md
      - Mail: domains/mail.md
      - Calendar and meetings: domains/calendar-meetings.md
      - Contacts: domains/contacts.md
      - Social publishing and media: domains/social-publishing.md
      - Integrations and plugins: domains/integrations-plugins.md
      - Authentication, workspaces, and sharing: domains/auth-workspaces-sharing.md
      - Automation and scheduling: domains/automation-scheduling.md
      - Desktop and companion clients: domains/desktop-clients.md
  - Security:
      - Trust model: security/trust-model.md
  - Operations:
      - Runbook: operations/runbook.md
  - Quality:
      - Test strategy: testing/test-strategy.md
      - Documentation maintenance: testing/documentation-maintenance.md
  - Decisions:
      - Decision records: decisions/index.md
      - Local-first source of truth: decisions/0001-local-first-source-of-truth.md
      - Documentation as code: decisions/0002-documentation-as-code.md
  - Generated reference:
      - Repository inventory: generated/repository-inventory.md
      - API catalog: generated/api-catalog.md
      - Backend modules: generated/backend-modules.md
      - Frontend catalog: generated/frontend-catalog.md
      - Relational data model: generated/data-model.md
      - Configuration: generated/configuration.md
      - Tests: generated/tests.md
      - Runtime skills: generated/skills.md
      - Coverage: generated/coverage.md

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

extra_javascript:
  - https://unpkg.com/mermaid@11/dist/mermaid.min.js
  - assets/mermaid-init.js
  - assets/language-switcher.js

extra_css:
  - assets/engineering.css

exclude_docs: |
  generated/.gitkeep
