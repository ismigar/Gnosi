# Configuration for the Drupal MCP Proxy.

mcp_server:
  # Command used to launch the upstream Drupal MCP server.
  # It can run locally (docker exec) or remotely (ssh). Adjust as needed.
  command: "/usr/local/bin/docker"
  args:
    - "exec"
    - "-i"
    - "mcp-drupal"
    - "deno"
    - "run"
    - "-A"
    - "/app/src/mod.ts"
    - "--drupal-url"
    # The Drupal URL (including any basic-auth credentials) MUST be provided via
    # the DRUPAL_URL environment variable — never hardcode secrets in this file,
    # which is tracked in a public repository. Example:
    #   export DRUPAL_URL="https://user:pass@drupal.example.org"
    - "${DRUPAL_URL}"

  # Extra environment variables, if any.
  env: {}

# Cache configuration.
cache:
  enabled: true
  ttl_seconds: 3600 # 1 hour
  file_path: ".tools_cache.json"

# Search configuration.
search:
  fuzzy_threshold: 60 # Minimum score (0-100) to consider a match
  max_results: 10
