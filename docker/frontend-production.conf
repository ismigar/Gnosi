# Included in nginx's http context by the official image.
map $http_upgrade $gnosi_connection_upgrade {
    default upgrade;
    '' close;
}

# The external TLS proxy must replace this header with its observed protocol.
map $http_x_forwarded_proto $gnosi_forwarded_proto {
    default $scheme;
    https https;
    http http;
}

server {
    listen 5173;
    listen [::]:5173;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Re-resolve the Compose service when a backend container is recreated.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $gnosi_backend http://backend:5002;

    # Auth cookies, scope headers and conditional note writes stay same-origin.
    location /api {
        proxy_pass $gnosi_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $gnosi_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $gnosi_connection_upgrade;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        client_max_body_size 1g;
        proxy_cache off;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        add_header Cache-Control "no-store" always;
    }

    location = /gnosi-offline-worker.js {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
        add_header Service-Worker-Allowed "/" always;
    }

    # A missing shell or manifest must fail installation, never serve SPA HTML.
    location = /offline.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }

    location = /manifest.json {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }

    # This directory contains Vite's content-addressed compiled assets only.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Build metadata is not part of the public web entry.
    location ~ /\. {
        return 404;
    }

    # Public share links and other application routes retain normal SPA routing.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
}
