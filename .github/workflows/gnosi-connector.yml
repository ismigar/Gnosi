name: Gnosi MCP connector
on:
  push:
    paths: ['extensions/mcp/gnosi-connector/**', '.github/workflows/gnosi-connector.yml']
  pull_request:
    paths: ['extensions/mcp/gnosi-connector/**', '.github/workflows/gnosi-connector.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: extensions/mcp/gnosi-connector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install . pytest
      - run: python -m pytest -q
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t gnosi-connector:test extensions/mcp/gnosi-connector
      - run: docker run --rm gnosi-connector:test --help
