name: Refresh vendor files

# Refresca fitxers de tercers que NO són gestionats per Dependabot
# (fitxers descarregats individualment, no via package managers).
#
# Concretament:
#   - CSL Styles a `frontend/public/csl/styles/*.csl`
#     (descarregats de citation-style-language/styles)
#   - CSL Locales a `frontend/public/csl/locales/*.xml`
#     (de citation-style-language/locales)
#   - Zotero translations `.ftl` a `frontend/public/zotero-reader/locales/`
#     (de zotero/zotero al commit pinned al submodule)
#   - Catàleg de models vendored a `backend/data/model_catalog.json`
#     (snapshot de models.dev/api.json; fallback offline del router — el
#     runtime ja es refresca sol diàriament, això manté fresc el zero-network)
#
# Si detecta canvis, crea un PR setmanal amb el diff i el MERGEJA sol
# (squash): són dades de tercers determinístiques, mai codi. Com que el push
# del GITHUB_TOKEN no encadena workflows, després del merge es dispara
# sync.yml explícitament perquè el mirall públic no es quedi enrere. Si el
# merge automàtic falla (p.ex. conflicte), el PR queda obert per revisió
# humana i el workflow només emet un warning.

on:
  schedule:
    # Dilluns 4:00 UTC (just després de Dependabot per evitar concurrència)
    - cron: '0 4 * * 1'
  workflow_dispatch:  # permet executar manualment des de la UI

permissions:
  contents: write
  pull-requests: write
  actions: write  # per disparar sync.yml després de l'auto-merge

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false  # no necessitem el submodule pesant

      - name: Re-download CSL Styles
        run: |
          set -e
          cd monorepo/apps/gnosi/frontend/public/csl/styles
          for s in apa chicago-author-date modern-language-association ieee; do
            url="https://raw.githubusercontent.com/citation-style-language/styles/master/$s.csl"
            curl -sS -f -L --retry 3 -o "$s.csl.new" "$url"
            if ! cmp -s "$s.csl" "$s.csl.new"; then
              mv "$s.csl.new" "$s.csl"
              echo "Updated: $s.csl"
            else
              rm "$s.csl.new"
            fi
          done

      - name: Re-download CSL Locales
        run: |
          set -e
          cd monorepo/apps/gnosi/frontend/public/csl/locales
          for lang in ca-AD es-ES en-US en-GB; do
            url="https://raw.githubusercontent.com/citation-style-language/locales/master/locales-$lang.xml"
            curl -sS -f -L --retry 3 -o "locales-$lang.xml.new" "$url"
            if ! cmp -s "locales-$lang.xml" "locales-$lang.xml.new"; then
              mv "locales-$lang.xml.new" "locales-$lang.xml"
              echo "Updated: locales-$lang.xml"
            else
              rm "locales-$lang.xml.new"
            fi
          done

      - name: Re-download Zotero translations
        run: |
          set -e
          # El commit hash del submodule defineix la versió alineada;
          # si no l'agafem aquí, descarreguem del HEAD que pot ser
          # incoherent. Sense `submodules: true` no tenim
          # .zotero-locale-commit del submodule, així que llegim de master.
          COMMIT=$(curl -sS -f "https://api.github.com/repos/zotero/reader/contents/.zotero-locale-commit?ref=master" \
            | python3 -c "import json,sys,base64; print(base64.b64decode(json.load(sys.stdin)['content']).decode().strip())")
          if [ -z "$COMMIT" ]; then
            echo "No s'ha pogut llegir el commit hash del Zotero locale" >&2
            exit 1
          fi
          echo "Zotero locale commit: $COMMIT"
          cd monorepo/apps/gnosi/frontend/public/zotero-reader/locales
          for lang in en-US ca-AD es-ES; do
            for file in zotero.ftl reader.ftl; do
              url="https://raw.githubusercontent.com/zotero/zotero/$COMMIT/chrome/locale/$lang/zotero/$file"
              mkdir -p "$lang"
              if curl -sS -f -L --retry 3 -o "$lang/$file.new" "$url"; then
                if [ -f "$lang/$file" ] && cmp -s "$lang/$file" "$lang/$file.new"; then
                  rm "$lang/$file.new"
                else
                  mv "$lang/$file.new" "$lang/$file"
                  echo "Updated: $lang/$file"
                fi
              else
                echo "WARN: $url failed, skipping" >&2
                rm -f "$lang/$file.new"
              fi
            done
          done

      - name: Regenerate vendored model catalog (models.dev)
        run: |
          set -e
          python3 -m pip install --quiet requests
          cd monorepo/apps/gnosi
          # The script leaves the file untouched when only generated_at would
          # change, so a bare timestamp never triggers the weekly PR.
          python3 -m backend.scripts.refresh_model_catalog

      - name: Create Pull Request (si hi ha canvis)
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "chore(vendor): refresh CSL styles, locales, Zotero translations i model catalog"
          title: "chore(vendor): refresh vendor files (weekly)"
          body: |
            Refresca automàtica dels fitxers de tercers descarregats fora
            de package managers:

            - `monorepo/apps/gnosi/frontend/public/csl/styles/*.csl`
              (citation-style-language/styles@master)
            - `monorepo/apps/gnosi/frontend/public/csl/locales/*.xml`
              (citation-style-language/locales@master)
            - `monorepo/apps/gnosi/frontend/public/zotero-reader/locales/<lang>/*.ftl`
              (zotero/zotero al commit pinned per `zotero/reader`)
            - `monorepo/apps/gnosi/backend/data/model_catalog.json`
              (snapshot compacte de models.dev/api.json — fallback offline
              del catàleg de models del router)

            Generat per `.github/workflows/refresh-vendor-files.yml`.
            Es mergeja automàticament (squash); si l'auto-merge falla
            (conflicte), queda obert per revisió manual.
          branch: chore/refresh-vendor-files
          labels: dependencies,vendor
          delete-branch: true

      - name: Auto-merge (squash) i sync del mirall públic
        if: steps.cpr.outputs.pull-request-operation == 'created' || steps.cpr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR="${{ steps.cpr.outputs.pull-request-number }}"
          # Vendor data only, never code: merge without human review. Main has no
          # branch protection, so this is a direct squash-merge (gh's --auto mode
          # needs protection rules). A failed merge (e.g. conflict) leaves the PR
          # open for a human instead of failing the whole run.
          if gh pr merge "$PR" --squash --delete-branch; then
            echo "PR #$PR auto-merged."
            # A GITHUB_TOKEN push does not chain workflows, so sync.yml (public
            # mirror export) must be dispatched explicitly.
            gh workflow run sync.yml --ref main || echo "::warning::sync.yml dispatch failed — run it manually"
          else
            echo "::warning::Auto-merge of PR #$PR failed — left open for manual review"
          fi
