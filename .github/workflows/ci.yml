name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  documentation:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: '0.9.15'
      - run: uv sync --frozen --group docs
      - name: Check documentation against the exact PR base
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          test -n "$PR_BASE_SHA"
          git cat-file -e "${PR_BASE_SHA}^{commit}"
          uv run --frozen --group docs python pipeline/skills/technical_documentation/scripts/pre_pr.py --check-only --base-ref "$PR_BASE_SHA"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
      - uses: actions/setup-node@v7
        with:
          node-version: '22.22.2'
          cache: pnpm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: '0.9.15'
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      - run: uv sync --frozen
      - name: Check deterministic OpenAPI and generated frontend client
        run: pnpm check:api-client
      - name: Enforce frontend migration guardrails
        run: pnpm guardrails:frontend
      - run: pnpm lint:frontend
      - run: pnpm --filter @gnosi/frontend typecheck
      - run: pnpm test:frontend
      - run: pnpm build:frontend
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - run: pnpm test:desktop
      - run: pnpm --filter @gnosi/desktop typecheck:ipc

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: '0.9.15'
          enable-cache: true
      - run: uv sync --frozen
      - name: Reject private tools and generated pipeline state
        run: uv run python scripts/check_public_pipeline.py
      - run: uv run ruff check backend pipeline scripts extensions/mcp/drupal-proxy
      - run: uv run python scripts/check-source-guardrails.py --require-pruned
      - name: Strict type-check of the complete backend
        run: uv run mypy --strict --exclude '^backend/tests/' backend
      - name: Strict type-check of every public pipeline Python file
        run: uv run python scripts/check_public_pipeline.py --typecheck
      - name: Validate frozen backend resource policy
        run: |
          uv run ruff check --select E,F,I desktop/scripts/backend_resources.py desktop/tests/test_backend_resources.py
          uv run mypy --strict --explicit-package-bases desktop/scripts/backend_resources.py desktop/tests/test_backend_resources.py
          uv run python desktop/scripts/backend_resources.py check-source --repository .
      - run: uv run python -m compileall -q backend pipeline scripts extensions
      - run: uv run pytest

  native-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
      - uses: actions/setup-node@v7
        with:
          node-version: '22.22.2'
          cache: pnpm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: '0.9.15'
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      - run: uv sync --frozen
      - run: pnpm test:e2e:install
      - name: Start native services
        env:
          DIGITAL_BRAIN_VAULT_PATH: ${{ github.workspace }}/vault
          GNOSI_DATA_DIR: ${{ runner.temp }}/gnosi-data
        run: |
          uv run uvicorn backend.server:app --host 127.0.0.1 --port 5002 > "${RUNNER_TEMP}/gnosi-backend.log" 2>&1 &
          pnpm dev:frontend -- --host 127.0.0.1 > "${RUNNER_TEMP}/gnosi-frontend.log" 2>&1 &
          for attempt in $(seq 1 60); do
            curl --fail --silent http://127.0.0.1:5002/api/health >/dev/null \
              && curl --fail --silent http://127.0.0.1:5173/ >/dev/null \
              && exit 0
            sleep 2
          done
          tail -n 200 "${RUNNER_TEMP}/gnosi-backend.log" || true
          tail -n 200 "${RUNNER_TEMP}/gnosi-frontend.log" || true
          exit 1
      - run: pnpm test:e2e:smoke
        env:
          GNOSI_BASE_URL: http://127.0.0.1:5173

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - run: docker compose config --quiet
        env:
          GNOSI_JWT_SECRET: ci-configuration-placeholder-only
      - run: docker build --file Dockerfile.frontend --tag gnosi-frontend:ci .
      - run: docker build --file Dockerfile.backend --tag gnosi-backend:ci .
