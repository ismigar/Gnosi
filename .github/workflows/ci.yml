name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
      - uses: actions/setup-node@v7
        with:
          node-version: '22.22.2'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:frontend
      - run: pnpm --filter @gnosi/frontend typecheck
      - run: pnpm test:frontend
      - run: pnpm build:frontend
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - run: pnpm test:desktop

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: '0.9.15'
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check backend pipeline scripts extensions/mcp/drupal-proxy
      - run: uv run python -m compileall -q backend pipeline scripts extensions
      - run: uv run pytest

  native-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
      - uses: actions/setup-node@v7
        with:
          node-version: '22.22.2'
          cache: pnpm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: '0.9.15'
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      - run: uv sync --frozen
      - run: pnpm test:e2e:install
      - name: Start native services
        env:
          DIGITAL_BRAIN_VAULT_PATH: ${{ github.workspace }}/vault
          GNOSI_DATA_DIR: ${{ runner.temp }}/gnosi-data
          GNOSI_LOCAL_DATA: ${{ runner.temp }}/gnosi-data
        run: |
          uv run uvicorn backend.server:app --host 127.0.0.1 --port 5002 > "${RUNNER_TEMP}/gnosi-backend.log" 2>&1 &
          pnpm dev:frontend -- --host 127.0.0.1 > "${RUNNER_TEMP}/gnosi-frontend.log" 2>&1 &
          for attempt in $(seq 1 60); do
            curl --fail --silent http://127.0.0.1:5002/api/health >/dev/null \
              && curl --fail --silent http://127.0.0.1:5173/ >/dev/null \
              && exit 0
            sleep 2
          done
          tail -n 200 "${RUNNER_TEMP}/gnosi-backend.log" || true
          tail -n 200 "${RUNNER_TEMP}/gnosi-frontend.log" || true
          exit 1
      - run: pnpm test:e2e:smoke
        env:
          GNOSI_BASE_URL: http://127.0.0.1:5173

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - run: docker compose config --quiet
        env:
          GNOSI_JWT_SECRET: ci-configuration-placeholder-only
      - run: docker build --file Dockerfile.frontend --tag gnosi-frontend:ci .
      - run: docker build --file Dockerfile.backend --tag gnosi-backend:ci .
