# Guard for the Docker deployment mode (self-host). Since the default dev
# runtime went native (2026-06-17), nobody exercises the Docker path daily —
# without CI it would rot silently. This workflow builds both images, validates
# docker-compose.yml, and smoke-boots the backend container against an empty
# local vault (GNOSI_FILES_PROVIDER=local, no cloud, no secrets — everything is
# expected to degrade gracefully) until /api/health answers.
#
# Triggers: PRs that touch the Docker recipe itself, a weekly run to catch
# code-level rot (backend/frontend changes are NOT in the PR paths on purpose —
# the backend image is heavy), and manual dispatch.
name: docker-build

on:
  pull_request:
    paths:
      - "monorepo/apps/gnosi/Dockerfile.*"
      - "monorepo/apps/gnosi/docker-compose.yml"
      - "monorepo/apps/gnosi/requirements.txt"
      - "monorepo/apps/gnosi/frontend/package*.json"
      - ".github/workflows/docker-build.yml"
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

jobs:
  backend:
    runs-on: [self-hosted, Linux, ARM64]
    # Ephemeral test-only value required by Compose interpolation and by the
    # fail-closed Docker startup guard. It signs no persistent sessions.
    env:
      GNOSI_JWT_SECRET: ci-only-7f15e867273441a6b3914705466593864d5f67b038f84301
      XDG_RUNTIME_DIR: /run/user/501
    defaults:
      run:
        working-directory: monorepo/apps/gnosi
    steps:
      - uses: actions/checkout@v7

      # The backend image is large (torch et al.); the stock runner disk can
      # run out mid-build. Drop preinstalled toolchains we never use.
      - name: Free disk space
        working-directory: /
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Validate docker-compose.yml
        run: |
          # compose declares both env_files; they are gitignored, so provide
          # empty stand-ins for interpolation/validation.
          touch ../../../.env_shared .env
          nerdctl compose config -q

      - name: Build backend image
        run: nerdctl build -f Dockerfile.backend -t gnosi-backend:ci .

      - name: Smoke test — backend boots and serves /api/health
        run: |
          mkdir -p /tmp/ci-vault
          nerdctl run -d --name gnosi_ci -p 5002:5002 \
            -e DIGITAL_BRAIN_VAULT_PATH=/vault \
            -e GNOSI_FILES_PROVIDER=local \
            -e GNOSI_JWT_SECRET="${GNOSI_JWT_SECRET}" \
            -e PYTHONPATH=/app \
            -v /tmp/ci-vault:/vault \
            gnosi-backend:ci
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:5002/api/health >/dev/null; then
              echo "backend healthy after ~$((i * 2))s"
              exit 0
            fi
            sleep 2
          done
          echo "::error::backend never became healthy"
          nerdctl logs gnosi_ci
          exit 1

      - name: Cleanup
        if: always()
        run: nerdctl rm -f gnosi_ci 2>/dev/null || true

  frontend:
    runs-on: [self-hosted, Linux, ARM64]
    env:
      XDG_RUNTIME_DIR: /run/user/501
    defaults:
      run:
        working-directory: monorepo/apps/gnosi
    steps:
      - uses: actions/checkout@v7
      - name: Build frontend image
        run: nerdctl build -f Dockerfile.frontend -t gnosi-frontend:ci .
