name: Sync Landing Repo

on:
  push:
    branches:
      - main
    paths:
      - 'ismigar.github.io/**'
      - '.github/workflows/sync-landing.yml'
  workflow_dispatch:

jobs:
  sync-landing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create subtree branch
        run: git subtree split --prefix=ismigar.github.io -b tmp/landing-sync

      - name: Push to ismigar.github.io repo
        env:
          LANDING_TOKEN: ${{ secrets.LANDING_REPO_TOKEN }}
        run: |
          if [ -z "$LANDING_TOKEN" ]; then
            echo "Missing secret LANDING_REPO_TOKEN" >&2
            exit 1
          fi

          git remote add landing "https://x-access-token:${LANDING_TOKEN}@github.com/ismigar/ismigar.github.io.git"
          git push --force landing tmp/landing-sync:main
