name: E2E — Update Linux Visual Baselines (manual)

# Manual trigger to regenerate Linux baselines for visual regression tests.
# Workflow:
#   1. Run from GitHub Actions UI (workflow_dispatch).
#   2. Build frontend, start preview server, run Playwright with --update-snapshots.
#   3. Generated *-linux.png files are uploaded as an artifact.
#   4. Download the artifact, place in tests/visual/regression.spec.ts-snapshots/, commit.
#
# This avoids the friction of running Playwright in Docker locally against Vite dev,
# and ensures baselines exactly match the CI environment.

on:
  workflow_dispatch:

jobs:
  update-baselines:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            apps/gnosi/frontend/package-lock.json
            apps/gnosi/e2e/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/gnosi/requirements-e2e.txt

      - name: Install backend dependencies
        working-directory: apps/gnosi
        run: python -m pip install -r requirements-e2e.txt

      - name: Start backend
        working-directory: apps/gnosi
        env:
          DIGITAL_BRAIN_VAULT_PATH: ${{ runner.temp }}/gnosi-vault
          GNOSI_LOCAL_DATA: ${{ runner.temp }}/gnosi-local-data
          GNOSI_REQUIRE_AUTH: 'false'
          GNOSI_JWT_SECRET: ci-only-secret-for-e2e
          GNOSI_INDEX_WARMUP: 'false'
        run: |
          mkdir -p "$DIGITAL_BRAIN_VAULT_PATH" "$GNOSI_LOCAL_DATA"
          nohup python -m uvicorn backend.server:app --host 127.0.0.1 --port 5002 --lifespan off \
            > "$RUNNER_TEMP/gnosi-backend.log" 2>&1 &
          for attempt in $(seq 1 120); do
            if curl --fail --silent http://127.0.0.1:5002/api/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Backend failed to become ready; log follows:"
          cat "$RUNNER_TEMP/gnosi-backend.log"
          exit 1

      - name: Install frontend dependencies
        working-directory: apps/gnosi/frontend
        run: npm ci

      - name: Build frontend
        working-directory: apps/gnosi/frontend
        run: npm run build
        env:
          # Baselines must be generated with the exact asset URL strategy used
          # by the pull-request E2E workflow.
          VITE_BASE_PATH: /

      - name: Start frontend (preview)
        working-directory: apps/gnosi/frontend
        run: |
          npx vite preview --port 5173 --strictPort &
          npx wait-on http://localhost:5173 --timeout 60000

      - name: Install E2E dependencies
        working-directory: apps/gnosi/e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: apps/gnosi/e2e
        run: npx playwright install --with-deps chromium

      - name: Generate Linux baselines (--update-snapshots)
        working-directory: apps/gnosi/e2e
        run: npx playwright test --project=visual --update-snapshots
        env:
          GNOSI_BASE_URL: http://localhost:5173

      - name: Upload Linux baselines as artifact
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines-linux
          path: apps/gnosi/e2e/tests/visual/regression.spec.ts-snapshots/*-linux.png
          retention-days: 30
          if-no-files-found: error
