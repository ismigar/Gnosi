name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g., v1.0.0)'
        required: false
        type: string

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          # Cache disabled: monorepo/apps/gnosi/electron has no committed lockfile yet.

      - name: Install npm dependencies
        run: |
          cd monorepo/apps/gnosi/electron
          npm install

      - name: Setup Python 3.11
        run: |
          brew install python@3.11
          echo "/opt/homebrew/opt/python@3.11/bin" >> $GITHUB_PATH
          python3.11 --version

      - name: Build frontend
        run: |
          cd monorepo/apps/gnosi/frontend
          npm install
          npm run build

      - name: Build Python bundle
        run: |
          cd monorepo/apps/gnosi/electron
          ./build-python.sh

      - name: Build Electron app (macOS ARM64)
        env:
          # No Apple Developer cert in CI; tell electron-builder not to
          # auto-discover identities so it produces an unsigned DMG cleanly.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          cd monorepo/apps/gnosi/electron
          npm run build:mac

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: macos-arm64
          path: monorepo/apps/gnosi/electron/dist/*.dmg
          retention-days: 5

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          # Cache disabled: monorepo/apps/gnosi/electron has no committed lockfile yet.

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install npm dependencies
        run: |
          cd monorepo/apps/gnosi/electron
          npm install

      - name: Build frontend
        run: |
          cd monorepo/apps/gnosi/frontend
          npm install
          npm run build

      - name: Build Python bundle
        run: |
          cd monorepo/apps/gnosi/electron
          ./build-python.sh

      - name: Build Electron app (Linux)
        run: |
          cd monorepo/apps/gnosi/electron
          npm run build:linux

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-x64
          path: |
            monorepo/apps/gnosi/electron/dist/*.AppImage
            monorepo/apps/gnosi/electron/dist/*.deb
          retention-days: 5

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          # Cache disabled: monorepo/apps/gnosi/electron has no committed lockfile yet.

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install npm dependencies
        run: |
          cd monorepo/apps/gnosi/electron
          npm install

      - name: Build frontend
        run: |
          cd monorepo/apps/gnosi/frontend
          npm install
          npm run build

      - name: Build Python bundle
        run: |
          cd monorepo/apps/gnosi/electron
          ./build-python.sh

      - name: Build Electron app (Windows)
        run: |
          cd monorepo/apps/gnosi/electron
          npm run build:win

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-x64
          path: monorepo/apps/gnosi/electron/dist/*Setup*.exe
          retention-days: 5

  release:
    needs: [build-macos, build-linux, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: '*'
          merge-multiple: true

      - name: List artifacts
        run: ls -laR artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/*.dmg
            artifacts/*.AppImage
            artifacts/*.deb
            artifacts/*Setup*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
