name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g., v1.0.0)'
        required: false
        type: string

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          # Cache disabled: monorepo/apps/gnosi/electron has no committed lockfile yet.

      - name: Install npm dependencies
        run: |
          cd monorepo/apps/gnosi/electron
          npm install

      - name: Setup Python 3.11
        run: |
          brew install python@3.11
          echo "/opt/homebrew/opt/python@3.11/bin" >> $GITHUB_PATH
          python3.11 --version

      - name: Build frontend
        env:
          # El bundle ha crescut (plugins, handwriting, spellcheck, KaTeX…) i el
          # build de Vite/rollup supera el heap per defecte de Node al runner
          # (~2 GB) → "JavaScript heap out of memory". Ampliem el heap.
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          cd monorepo/apps/gnosi/frontend
          npm install
          npm run build

      - name: Build Python bundle
        run: |
          cd monorepo/apps/gnosi/electron
          ./build-python.sh

      - name: Build Electron app (macOS ARM64)
        env:
          # No Apple Developer cert in CI; tell electron-builder not to
          # auto-discover identities so it produces an unsigned DMG cleanly.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          cd monorepo/apps/gnosi/electron
          npm run build:mac

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: macos-arm64
          path: |
            monorepo/apps/gnosi/electron/dist/*.dmg
            monorepo/apps/gnosi/electron/dist/*.zip
            monorepo/apps/gnosi/electron/dist/*.blockmap
            monorepo/apps/gnosi/electron/dist/latest-mac.yml
          retention-days: 5

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          # Cache disabled: monorepo/apps/gnosi/electron has no committed lockfile yet.

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install npm dependencies
        run: |
          cd monorepo/apps/gnosi/electron
          npm install

      - name: Build frontend
        env:
          # El bundle ha crescut (plugins, handwriting, spellcheck, KaTeX…) i el
          # build de Vite/rollup supera el heap per defecte de Node al runner
          # (~2 GB) → "JavaScript heap out of memory". Ampliem el heap.
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          cd monorepo/apps/gnosi/frontend
          npm install
          npm run build

      - name: Build Python bundle
        run: |
          cd monorepo/apps/gnosi/electron
          ./build-python.sh

      - name: Build Electron app (Linux)
        run: |
          cd monorepo/apps/gnosi/electron
          npm run build:linux

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-x64
          path: |
            monorepo/apps/gnosi/electron/dist/*.AppImage
            monorepo/apps/gnosi/electron/dist/*.deb
            monorepo/apps/gnosi/electron/dist/*.blockmap
            monorepo/apps/gnosi/electron/dist/latest-linux.yml
          retention-days: 5

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          # Cache disabled: monorepo/apps/gnosi/electron has no committed lockfile yet.

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install npm dependencies
        run: |
          cd monorepo/apps/gnosi/electron
          npm install

      - name: Build frontend
        env:
          # El bundle ha crescut (plugins, handwriting, spellcheck, KaTeX…) i el
          # build de Vite/rollup supera el heap per defecte de Node al runner
          # (~2 GB) → "JavaScript heap out of memory". Ampliem el heap.
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          cd monorepo/apps/gnosi/frontend
          npm install
          npm run build

      - name: Build Python bundle
        run: |
          cd monorepo/apps/gnosi/electron
          ./build-python.sh

      - name: Build Electron app (Windows)
        run: |
          cd monorepo/apps/gnosi/electron
          npm run build:win

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-x64
          path: |
            monorepo/apps/gnosi/electron/dist/*Setup*.exe
            monorepo/apps/gnosi/electron/dist/*.blockmap
            monorepo/apps/gnosi/electron/dist/latest.yml
          retention-days: 5

  release:
    needs: [build-macos, build-linux, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: '*'
          merge-multiple: true

      - name: List artifacts
        run: ls -laR artifacts/

      # Construeix i SIGNA l'índex remot de plugins oficials. La clau privada
      # arriba per secret (GNOSI_PLUGIN_SIGNING_KEY) i no toca mai el disc del
      # repo; si no està configurada, l'índex es genera sense signatura (l'app
      # els marcaria "no verificat"). Les entrades apunten a
      # releases/latest/download → l'app hi accedeix un cop publiques el release.
      - name: Setup Python (per a l'índex de plugins)
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Construeix l'índex de plugins signat
        env:
          GNOSI_PLUGIN_SIGNING_KEY: ${{ secrets.GNOSI_PLUGIN_SIGNING_KEY }}
        run: |
          python -m pip install --quiet cryptography
          python monorepo/apps/gnosi/plugins-examples/build_index.py \
            --base-url https://github.com/ismigar/Gnosi/releases/latest/download \
            --out artifacts/plugins
          ls -la artifacts/plugins/

      # Publiquem al repo PÚBLIC Gnosi (Projectes és privat) amb el SYNC_PAT,
      # el mateix token que el sync fa servir per escriure a Gnosi. Per això no
      # cal cap permís especial sobre el GITHUB_TOKEN d'aquest repo.
      - name: Publica el release a Gnosi (públic, en draft)
        uses: softprops/action-gh-release@v3
        with:
          repository: ismigar/Gnosi
          token: ${{ secrets.SYNC_PAT }}
          tag_name: ${{ github.ref_name }}
          name: Gnosi ${{ github.ref_name }}
          # Draft: els binaris arriben al repo públic però NO són visibles fins
          # que premis "Publish" manualment a Gnosi → fer-ho públic és cosa teva.
          draft: true
          # prerelease=true només si el tag porta sufix (v1.0.0-beta.1, -rc.2…).
          prerelease: ${{ contains(github.ref_name, '-') }}
          # Les notes automàtiques no funcionen a Gnosi (història reescrita pel
          # sync orphan+force); posem instruccions d'instal·lació, més útils.
          body: |
            ## Gnosi ${{ github.ref_name }}

            Download the file for your system:

            - **macOS (Apple Silicon / M1+)** → `*-arm64.dmg`
            - **macOS (Intel)** → `*-x64.dmg`
            - **Windows** → `*-Setup.exe`
            - **Linux** → `*-x86_64.AppImage` or `*-amd64.deb`

            > The binaries are unsigned. On macOS: right-click the app → **Open**. On Windows: **More info → Run anyway**.
          files: |
            artifacts/*.dmg
            artifacts/*.zip
            artifacts/*.AppImage
            artifacts/*.deb
            artifacts/*Setup*.exe
            artifacts/*.blockmap
            artifacts/latest*.yml
            artifacts/plugins/*.zip
            artifacts/plugins/plugins-index.json
