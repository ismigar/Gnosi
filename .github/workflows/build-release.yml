name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      local_only:
        description: 'Run every build on the configured self-hosted runners (recommended)'
        required: false
        default: true
        type: boolean
      tag:
        description: 'Tag to build (e.g., v1.0.0)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  release-preflight:
    name: validate-release-metadata
    runs-on: [self-hosted, Linux, ARM64]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Validate tag, packaged version, notes and changelog
        shell: bash
        run: |
          release_tag="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          if [[ ! "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "A semantic release tag is required; received: $release_tag" >&2
            exit 1
          fi

          release_version="${release_tag#v}"
          electron_version="$(node -p "require('./monorepo/apps/gnosi/electron/package.json').version")"
          frontend_version="$(node -p "require('./monorepo/apps/gnosi/frontend/package.json').version")"
          lock_version="$(node -p "require('./monorepo/package-lock.json').packages['apps/gnosi/frontend'].version")"

          for packaged_version in "$electron_version" "$frontend_version" "$lock_version"; do
            if [ "$packaged_version" != "$release_version" ]; then
              echo "Release tag $release_tag does not match packaged version $packaged_version." >&2
              exit 1
            fi
          done

          node monorepo/apps/gnosi/frontend/scripts/release-notes.mjs --check
          node monorepo/apps/gnosi/frontend/scripts/release-notes.mjs \
            --version "$release_tag" \
            --output "${RUNNER_TEMP}/release-notes.md"

  build-macos:
    name: build-macos-${{ matrix.arch }}
    needs: build-linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            hosted_runner: macos-15
            local_runner: [self-hosted, macOS, ARM64]
          - arch: x64
            hosted_runner: macos-15-intel
            local_runner: [self-hosted, macOS, X64]
    runs-on: ${{ matrix.local_runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: monorepo/apps/gnosi/electron/package-lock.json

      - name: Install npm dependencies
        run: |
          cd monorepo/apps/gnosi/electron
          npm install

      - name: Setup Python 3.11
        uses: actions/setup-python@v7
        env:
          RUNNER_TOOL_CACHE: ${{ runner.temp }}/_tool
          AGENT_TOOLSDIRECTORY: ${{ runner.temp }}/_tool
        with:
          python-version: '3.11'

      - name: Build frontend
        env:
          # El bundle ha crescut (plugins, handwriting, spellcheck, KaTeX…) i el
          # build de Vite/rollup supera el heap per defecte de Node al runner
          # (~2 GB) → "JavaScript heap out of memory". Ampliem el heap.
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          cd monorepo/apps/gnosi/frontend
          npm install
          npm run build

      - name: Build Electron app (macOS ${{ matrix.arch }})
        env:
          # The afterPack hook seals the complete bundle deterministically.
          # Do not auto-select unrelated local or development identities.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # build-python.sh must use the interpreter provisioned above instead
          # of discovering a newer runner-level Python with different dylibs.
          GNOSI_PYTHON_CMD: python
        run: |
          cd monorepo/apps/gnosi/electron
          npm run build:mac -- --${{ matrix.arch }}

      - name: Verify macOS application signatures
        run: |
          cd monorepo/apps/gnosi/electron
          for dmg in dist/*.dmg; do
            mount_dir="$(mktemp -d)"
            hdiutil attach -readonly -nobrowse -mountpoint "$mount_dir" "$dmg"
            codesign --verify --deep --strict --verbose=2 "$mount_dir/Gnosi.app"
            test -f "$mount_dir/Gnosi.app/Contents/Resources/icon.icns"
            test -f "$mount_dir/Gnosi.app/Contents/Resources/frontend/dist/index.html"
            hdiutil detach "$mount_dir"
            rmdir "$mount_dir"
          done

      - name: Publish macOS artifacts directly to Gnosi release
        uses: softprops/action-gh-release@v3
        with:
          repository: ismigar/Gnosi
          token: ${{ secrets.SYNC_PAT || secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: Gnosi ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          draft: false
          files: |
            monorepo/apps/gnosi/electron/dist/*.dmg
            monorepo/apps/gnosi/electron/dist/*.zip
            monorepo/apps/gnosi/electron/dist/*.blockmap
            monorepo/apps/gnosi/electron/dist/latest-mac.yml

  build-linux:
    needs: release-preflight
    runs-on: [self-hosted, Linux, ARM64]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: monorepo/apps/gnosi/electron/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v7
        env:
          RUNNER_TOOL_CACHE: ${{ runner.temp }}/_tool
          AGENT_TOOLSDIRECTORY: ${{ runner.temp }}/_tool
        with:
          python-version: '3.11'

      - name: Install npm dependencies
        run: |
          cd monorepo/apps/gnosi/electron
          npm install

      - name: Build frontend
        env:
          # El bundle ha crescut (plugins, handwriting, spellcheck, KaTeX…) i el
          # build de Vite/rollup supera el heap per defecte de Node al runner
          # (~2 GB) → "JavaScript heap out of memory". Ampliem el heap.
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          cd monorepo/apps/gnosi/frontend
          npm install
          npm run build

      - name: Build Python bundle
        env:
          GNOSI_PYTHON_CMD: python
        run: |
          cd monorepo/apps/gnosi/electron
          ./build-python.sh

      - name: Build Electron app (Linux)
        run: |
          cd monorepo/apps/gnosi/electron
          npm run build:linux

      - name: Render public release notes
        run: |
          node monorepo/apps/gnosi/frontend/scripts/release-notes.mjs \
            --version "${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}" \
            --output release-notes.md

      - name: Publish Linux artifacts directly to Gnosi release
        uses: softprops/action-gh-release@v3
        with:
          repository: ismigar/Gnosi
          token: ${{ secrets.SYNC_PAT || secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: Gnosi ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          body_path: release-notes.md
          draft: false
          files: |
            monorepo/apps/gnosi/electron/dist/*.AppImage
            monorepo/apps/gnosi/electron/dist/*.deb
            monorepo/apps/gnosi/electron/dist/*.blockmap
            monorepo/apps/gnosi/electron/dist/latest-linux.yml

  build-windows:
    needs: build-linux
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: monorepo/apps/gnosi/electron/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v7
        env:
          RUNNER_TOOL_CACHE: ${{ runner.temp }}/_tool
          AGENT_TOOLSDIRECTORY: ${{ runner.temp }}/_tool
        with:
          python-version: '3.11'

      - name: Install npm dependencies
        run: |
          cd monorepo/apps/gnosi/electron
          npm install

      - name: Build frontend
        env:
          # El bundle ha crescut (plugins, handwriting, spellcheck, KaTeX…) i el
          # build de Vite/rollup supera el heap per defecte de Node al runner
          # (~2 GB) → "JavaScript heap out of memory". Ampliem el heap.
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          cd monorepo/apps/gnosi/frontend
          npm install
          npm run build

      - name: Build Python bundle
        env:
          GNOSI_PYTHON_CMD: python
        run: |
          cd monorepo/apps/gnosi/electron
          ./build-python.sh

      - name: Build Electron app (Windows)
        run: |
          cd monorepo/apps/gnosi/electron
          npm run build:win

      - name: Publish Windows artifacts directly to Gnosi release
        uses: softprops/action-gh-release@v3
        with:
          repository: ismigar/Gnosi
          token: ${{ secrets.SYNC_PAT || secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: Gnosi ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          draft: false
          files: |
            monorepo/apps/gnosi/electron/dist/*Setup*.exe
            monorepo/apps/gnosi/electron/dist/*.blockmap
            monorepo/apps/gnosi/electron/dist/latest.yml

  release:
    needs: [build-macos, build-linux, build-windows]
    runs-on: [self-hosted, Linux, ARM64]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && startsWith(inputs.tag, 'v'))
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Define release tag
        id: release_tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare release metadata
        run: mkdir -p artifacts

      # Build and sign the official remote indexes. The private key arrives only
      # through GNOSI_PLUGIN_SIGNING_KEY and never belongs in the repository.
      # Missing signatures fail the release because official catalogs fail closed.
      - name: Setup Python (per a l'índex de plugins)
        uses: actions/setup-python@v7
        env:
          RUNNER_TOOL_CACHE: ${{ runner.temp }}/_tool
          AGENT_TOOLSDIRECTORY: ${{ runner.temp }}/_tool
        with:
          python-version: '3.11'

      - name: Construeix l'índex de plugins signat
        env:
          GNOSI_PLUGIN_SIGNING_KEY: ${{ secrets.GNOSI_PLUGIN_SIGNING_KEY }}
        run: |
          python -m pip install --quiet cryptography
          python monorepo/apps/gnosi/plugins-examples/build_index.py \
            --base-url https://github.com/ismigar/Gnosi/releases/latest/download \
            --out artifacts/plugins
          if [ -n "$GNOSI_PLUGIN_SIGNING_KEY" ]; then test -s artifacts/plugins/plugins-index.sig; fi
          ls -la artifacts/plugins/

      - name: Construeix les plantilles de Vault signades
        env:
          GNOSI_PLUGIN_SIGNING_KEY: ${{ secrets.GNOSI_PLUGIN_SIGNING_KEY }}
        run: |
          if [ -n "$GNOSI_PLUGIN_SIGNING_KEY" ]; then
            python monorepo/apps/gnosi/marketplace/build_vault_templates.py \
              --base-url https://github.com/ismigar/Gnosi/releases/latest/download \
              --out artifacts/vault-templates
            ls -la artifacts/vault-templates/
          else
            echo "Skipping vault templates signing (GNOSI_PLUGIN_SIGNING_KEY not set)"
            mkdir -p artifacts/vault-templates
          fi

      - name: Render public release notes
        run: |
          node monorepo/apps/gnosi/frontend/scripts/release-notes.mjs \
            --version "${{ steps.release_tag.outputs.tag }}" \
            --output artifacts/release-notes.md

      # Publiquem al repo PÚBLIC Gnosi (Projectes és privat) amb el SYNC_PAT,
      # o amb GITHUB_TOKEN si s'executa directament a Gnosi.
      - name: Publica el release a Gnosi (públic, en draft)
        uses: softprops/action-gh-release@v3
        with:
          repository: ismigar/Gnosi
          token: ${{ secrets.SYNC_PAT || secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: Gnosi ${{ steps.release_tag.outputs.tag }}
          # Publica directament la release a Gnosi perquè la web i els usuaris la puguin descarregar immediatament
          draft: false
          # prerelease=true només si el tag porta sufix (v1.0.0-beta.1, -rc.2…).
          prerelease: ${{ contains(steps.release_tag.outputs.tag, '-') }}
          # Les notes automàtiques no funcionen a Gnosi (història reescrita pel
          # sync orphan+force); posem instruccions d'instal·lació, més útils.
          body_path: artifacts/release-notes.md
          files: |
            artifacts/plugins/*.zip
            artifacts/plugins/plugins-index.json
            artifacts/plugins/plugins-index.sig
            artifacts/vault-templates/*.zip
            artifacts/vault-templates/vault-templates-index.json
            artifacts/vault-templates/vault-templates-index.sig
            artifacts/plugins/*.zip
            artifacts/plugins/plugins-index.json
            artifacts/plugins/plugins-index.sig
            artifacts/vault-templates/*.zip
            artifacts/vault-templates/vault-templates-index.json
            artifacts/vault-templates/vault-templates-index.sig
