name: Build Release Candidate

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build without publishing (for example v3.0.0-rc.1)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: [self-hosted, Linux, ARM64]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          submodules: recursive
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.22.2'
          cache: pnpm
      - name: Verify release source identity
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          REQUESTED_TAG: ${{ inputs.tag }}
          REF_TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          EXPECTED_SHA: ${{ github.sha }}
        run: node desktop/scripts/release-source-identity.cjs

  quality:
    needs: preflight
    uses: ./.github/workflows/ci.yml
    with:
      release_candidate: true

  build-macos:
    name: build-macos-${{ matrix.arch }}
    needs: [preflight, quality]
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - arch: arm64
            runner_arch: ARM64
          - arch: x64
            runner_arch: X64
    runs-on: [self-hosted, macOS, "${{ matrix.runner_arch }}"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          submodules: recursive
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.22.2'
          cache: pnpm
      - name: Setup Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Setup uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: '0.9.15'
      - name: Install frozen Node dependencies
        run: pnpm install --frozen-lockfile
      - name: Build frontend
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm build:frontend
      - name: Build Electron app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GNOSI_PYTHON_CMD: python
        run: pnpm --filter @gnosi/desktop build:mac -- --${{ matrix.arch }}
      - name: Verify application signatures
        run: |
          for dmg in desktop/dist/*.dmg; do
            mount_dir="$(mktemp -d)"
            hdiutil attach -readonly -nobrowse -mountpoint "$mount_dir" "$dmg"
            codesign --verify --deep --strict --verbose=2 "$mount_dir/Gnosi.app"
            test -f "$mount_dir/Gnosi.app/Contents/Resources/icon.icns"
            test -f "$mount_dir/Gnosi.app/Contents/Resources/frontend/dist/index.html"
            hdiutil detach "$mount_dir"
            rmdir "$mount_dir"
          done
      - name: Validate macOS release artifacts
        run: node desktop/scripts/release-artifacts.cjs validate macos-${{ matrix.arch }} desktop/dist
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.blockmap
            desktop/dist/latest-mac.yml
          retention-days: 5

  build-linux:
    needs: [preflight, quality]
    runs-on: [self-hosted, Linux, ARM64]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          submodules: recursive
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.22.2'
          cache: pnpm
      - name: Setup Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Setup uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: '0.9.15'
      - name: Install and build
        env:
          GNOSI_PYTHON_CMD: python
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          pnpm install --frozen-lockfile
          pnpm build:frontend
          desktop/build-python.sh
          pnpm --filter @gnosi/desktop exec electron-builder --linux --arm64 --publish never
      - name: Validate Linux ARM64 release artifacts
        run: node desktop/scripts/release-artifacts.cjs validate linux-arm64 desktop/dist
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-arm64
          if-no-files-found: error
          path: |
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/*.blockmap
            desktop/dist/latest-linux-arm64.yml
          retention-days: 5

  build-windows:
    needs: [preflight, quality, build-macos]
    runs-on: [self-hosted, Windows, X64]
    defaults:
      run:
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
    steps:
      - name: Ensure Git is available
        run: |
          $gitCmd = Get-Command git -ErrorAction SilentlyContinue
          if (-not $gitCmd) {
            $gitPath = 'C:\Program Files\Git\cmd'
            if (-not (Test-Path "$gitPath\git.exe")) { throw 'Git is required' }
            $env:Path = "$gitPath;$env:Path"
            "${gitPath}" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          submodules: recursive
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.22.2'
          cache: pnpm
      - name: Setup Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Setup uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: '0.9.15'
      - name: Install and build
        env:
          GNOSI_PYTHON_CMD: python
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          pnpm install --frozen-lockfile
          pnpm build:frontend
          pnpm --filter @gnosi/desktop build:win
      - name: Validate Windows release artifacts
        run: node desktop/scripts/release-artifacts.cjs validate windows-x64 desktop/dist
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-x64
          if-no-files-found: error
          path: |
            desktop/dist/*Setup*.exe
            desktop/dist/*.blockmap
            desktop/dist/latest.yml
          retention-days: 5

  release:
    name: Collect candidate (publication disabled)
    needs: [quality, build-macos, build-linux, build-windows]
    runs-on: [self-hosted, Linux, ARM64]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          submodules: recursive
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.22.2'
      - name: Prepare locked artifact collector dependencies
        run: pnpm --filter @gnosi/desktop install --prod --frozen-lockfile --ignore-scripts
      - name: Setup Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Setup uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: '0.9.15'
      - name: Prepare isolated Python environment
        run: python scripts/ci/prepare_python_environment.py
      - name: Define release tag
        id: release_tag
        shell: bash
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          REQUESTED_TAG: ${{ inputs.tag }}
          REF_TAG: ${{ github.ref_name }}
        run: |
          if [ "$RELEASE_EVENT" = "workflow_dispatch" ]; then
            release_tag="$REQUESTED_TAG"
          else
            release_tag="$REF_TAG"
          fi
          if [[ ! "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo 'Invalid release tag' >&2
            exit 1
          fi
          printf 'tag=%s\n' "$release_tag" >> "$GITHUB_OUTPUT"
      - name: Download macos-arm64 artifacts
        uses: actions/download-artifact@v8
        with:
          name: macos-arm64
          path: artifacts-incoming/macos-arm64
      - name: Download macos-x64 artifacts
        uses: actions/download-artifact@v8
        with:
          name: macos-x64
          path: artifacts-incoming/macos-x64
      - name: Download linux-arm64 artifacts
        uses: actions/download-artifact@v8
        with:
          name: linux-arm64
          path: artifacts-incoming/linux-arm64
      - name: Download windows-x64 artifacts
        uses: actions/download-artifact@v8
        with:
          name: windows-x64
          path: artifacts-incoming/windows-x64
      - name: Validate and collect release artifacts
        env:
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
        run: node desktop/scripts/release-artifacts.cjs collect artifacts-incoming artifacts "$RELEASE_TAG"
      - name: Build signed public indexes
        env:
          GNOSI_PLUGIN_SIGNING_KEY: ${{ secrets.GNOSI_PLUGIN_SIGNING_KEY }}
        run: |
          uv run --frozen --no-default-groups python extensions/examples/build_index.py \
            --base-url https://github.com/ismigar/Gnosi/releases/latest/download \
            --out artifacts/plugins
          uv run --frozen --no-default-groups python extensions/marketplace/build_vault_templates.py \
            --base-url https://github.com/ismigar/Gnosi/releases/latest/download \
            --out artifacts/vault-templates
      - name: Render public release notes
        run: |
          node frontend/scripts/release-notes.mjs \
            --version "${{ steps.release_tag.outputs.tag }}" \
            --output artifacts/release-notes.md
      - name: Verify complete signed candidate
        run: >-
          uv run --frozen --no-default-groups python
          extensions/marketplace/verify_release_candidate.py
          --artifacts artifacts
      # These artifacts are review inputs, not approval of the complete native,
      # Docker, installer and 2.x upgrade matrix. No public release is mutated.
      - name: Upload validated release candidate
        uses: actions/upload-artifact@v7
        with:
          name: candidate-${{ steps.release_tag.outputs.tag }}-${{ github.sha }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 5
          path: |
            artifacts/release-notes.md
            artifacts/*.dmg
            artifacts/*.zip
            artifacts/*.AppImage
            artifacts/*.deb
            artifacts/*Setup*.exe
            artifacts/*.blockmap
            artifacts/latest*.yml
            artifacts/plugins/*.zip
            artifacts/plugins/plugins-index.json
            artifacts/plugins/plugins-index.sig
            artifacts/vault-templates/*.zip
            artifacts/vault-templates/vault-templates-index.json
            artifacts/vault-templates/vault-templates-index.sig
