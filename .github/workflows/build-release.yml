name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (for example v3.0.0-rc.1)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          submodules: recursive
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.22.2'
          cache: pnpm
      - name: Setup Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Setup uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: '0.9.15'
      - name: Install frozen Node dependencies
        run: pnpm install --frozen-lockfile
      - name: Install frozen Python dependencies
        run: uv sync --frozen
      - name: Check deterministic OpenAPI and generated frontend client
        run: pnpm check:api-client
      - name: Build frontend
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm build:frontend
      - name: Test desktop runtime
        run: pnpm test:desktop

  build-macos:
    name: build-macos-${{ matrix.arch }}
    needs: preflight
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - arch: arm64
            local_runner: [self-hosted, macOS, ARM64]
          - arch: x64
            local_runner: [self-hosted, macOS, X64]
    runs-on: ${{ matrix.local_runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          submodules: recursive
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.22.2'
          cache: pnpm
      - name: Setup Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Setup uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: '0.9.15'
      - name: Install frozen Node dependencies
        run: pnpm install --frozen-lockfile
      - name: Build frontend
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm build:frontend
      - name: Build Electron app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GNOSI_PYTHON_CMD: python
        run: pnpm --filter @gnosi/desktop build:mac -- --${{ matrix.arch }}
      - name: Verify application signatures
        run: |
          for dmg in desktop/dist/*.dmg; do
            mount_dir="$(mktemp -d)"
            hdiutil attach -readonly -nobrowse -mountpoint "$mount_dir" "$dmg"
            codesign --verify --deep --strict --verbose=2 "$mount_dir/Gnosi.app"
            test -f "$mount_dir/Gnosi.app/Contents/Resources/icon.icns"
            test -f "$mount_dir/Gnosi.app/Contents/Resources/frontend/dist/index.html"
            hdiutil detach "$mount_dir"
            rmdir "$mount_dir"
          done
      - name: Validate macOS release artifacts
        run: node desktop/scripts/release-artifacts.cjs validate macos-${{ matrix.arch }} desktop/dist
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.blockmap
            desktop/dist/latest-mac.yml
          retention-days: 5

  build-linux:
    needs: preflight
    runs-on: [self-hosted, Linux, ARM64]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          submodules: recursive
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.22.2'
          cache: pnpm
      - name: Setup Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Setup uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: '0.9.15'
      - name: Install and build
        env:
          GNOSI_PYTHON_CMD: python
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          pnpm install --frozen-lockfile
          pnpm build:frontend
          desktop/build-python.sh
          pnpm --filter @gnosi/desktop exec electron-builder --linux --arm64 --publish never
      - name: Validate Linux ARM64 release artifacts
        run: node desktop/scripts/release-artifacts.cjs validate linux-arm64 desktop/dist
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-arm64
          if-no-files-found: error
          path: |
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/*.blockmap
            desktop/dist/latest-linux-arm64.yml
          retention-days: 5

  build-windows:
    needs: [preflight, build-macos]
    runs-on: [self-hosted, Windows, X64]
    defaults:
      run:
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
    steps:
      - name: Ensure Git is available
        run: |
          $gitCmd = Get-Command git -ErrorAction SilentlyContinue
          if (-not $gitCmd) {
            $gitPath = 'C:\Program Files\Git\cmd'
            if (-not (Test-Path "$gitPath\git.exe")) { throw 'Git is required' }
            $env:Path = "$gitPath;$env:Path"
            "${gitPath}" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          submodules: recursive
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.22.2'
          cache: pnpm
      - name: Setup Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Setup uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: '0.9.15'
      - name: Install and build
        env:
          GNOSI_PYTHON_CMD: python
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          pnpm install --frozen-lockfile
          pnpm build:frontend
          pnpm --filter @gnosi/desktop build:win
      - name: Validate Windows release artifacts
        run: node desktop/scripts/release-artifacts.cjs validate windows-x64 desktop/dist
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-x64
          if-no-files-found: error
          path: |
            desktop/dist/*Setup*.exe
            desktop/dist/*.blockmap
            desktop/dist/latest.yml
          retention-days: 5

  release:
    needs: [build-macos, build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          submodules: recursive
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.22.2'
      - name: Setup Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Setup uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: '0.9.15'
      - name: Define release tag
        id: release_tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: '*'
          merge-multiple: true
      - name: Build signed public indexes
        env:
          GNOSI_PLUGIN_SIGNING_KEY: ${{ secrets.GNOSI_PLUGIN_SIGNING_KEY }}
        run: |
          uv run --frozen --no-default-groups python extensions/examples/build_index.py \
            --base-url https://github.com/ismigar/Gnosi/releases/latest/download \
            --out artifacts/plugins
          if [ -n "$GNOSI_PLUGIN_SIGNING_KEY" ]; then
            test -s artifacts/plugins/plugins-index.sig
            uv run --frozen --no-default-groups python extensions/marketplace/build_vault_templates.py \
              --base-url https://github.com/ismigar/Gnosi/releases/latest/download \
              --out artifacts/vault-templates
          fi
      - name: Render public release notes
        run: |
          node frontend/scripts/release-notes.mjs \
            --version "${{ steps.release_tag.outputs.tag }}" \
            --output artifacts/release-notes.md
      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: Gnosi ${{ steps.release_tag.outputs.tag }}
          draft: false
          prerelease: ${{ contains(steps.release_tag.outputs.tag, '-') }}
          body_path: artifacts/release-notes.md
          files: |
            artifacts/*.dmg
            artifacts/*.zip
            artifacts/*.AppImage
            artifacts/*.deb
            artifacts/*Setup*.exe
            artifacts/*.blockmap
            artifacts/latest*.yml
            artifacts/plugins/*.zip
            artifacts/plugins/plugins-index.json
            artifacts/plugins/plugins-index.sig
            artifacts/vault-templates/*.zip
            artifacts/vault-templates/vault-templates-index.json
            artifacts/vault-templates/vault-templates-index.sig
