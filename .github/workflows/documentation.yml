name: engineering-documentation

on:
  pull_request:
    paths:
      - "monorepo/apps/gnosi/**"
      - "monorepo/.github/workflows/documentation-pages.yml"
      - "docs/dev_memory/directives/**"
      - ".github/workflows/documentation.yml"
  workflow_dispatch:

concurrency:
  group: engineering-documentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: monorepo/apps/gnosi
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: monorepo/apps/gnosi/requirements-docs.txt

      - name: Install documentation dependencies
        run: python -m pip install -r requirements-docs.txt pytest

      - name: Test documentation tooling
        env:
          PYTHONPATH: .
        run: pytest pipeline/skills/technical_documentation/tests -q

      - name: Require documentation for functional changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python pipeline/skills/technical_documentation/scripts/check_change_impact.py --base-ref "$BASE_SHA"

      - name: Verify generated reference
        run: python pipeline/skills/technical_documentation/scripts/generate.py --check

      - name: Validate traceability and links
        run: python pipeline/skills/technical_documentation/scripts/validate.py

      - name: Verify localized mirrors
        env:
          PYTHONPATH: .
        run: python pipeline/skills/technical_documentation/scripts/localize.py --check

      - name: Build English portal with strict warnings
        run: mkdocs build --strict

      - name: Build Catalan portal with strict warnings
        run: mkdocs build --strict --config-file mkdocs-ca.yml

      - name: Build Spanish portal with strict warnings
        run: mkdocs build --strict --config-file mkdocs-es.yml
