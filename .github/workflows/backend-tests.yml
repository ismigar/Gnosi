# Test gate for the backend. Until now nothing ran pytest on a PR: the only
# PR-triggered workflow was docker-build.yml, whose paths deliberately EXCLUDE
# backend/frontend code, so backend changes merged with zero automated checks.
#
# This runs the backend suite on PRs that touch backend code. It needs no
# services: the E2E tests skip themselves when no backend answers on
# GNOSI_BACKEND_URL, so we point it at a closed port to make that deterministic
# rather than dependent on whatever happens to listen on the runner.
#
# The vault and local_data are pointed at empty temp dirs so the suite never
# looks for the maintainer's OneDrive vault, and GNOSI_FILES_PROVIDER=local
# keeps the cloud provider out of it (same trick as docker-build.yml).
name: backend-tests

on:
  pull_request:
    paths:
      - "monorepo/apps/gnosi/backend/**"
      - "monorepo/apps/gnosi/pipeline/**"
      # Without this the connector suite would be collected but never
      # triggered by a change to the connector it guards.
      - "monorepo/apps/gnosi/integrations/**"
      - "monorepo/apps/gnosi/requirements.txt"
      - ".github/workflows/backend-tests.yml"
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

# A new push to the PR makes the in-flight run obsolete.
concurrency:
  group: backend-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 30
    defaults:
      run:
        working-directory: monorepo/apps/gnosi
    steps:
      - uses: actions/checkout@v7

      # The self-hosted runner does not expose its internal action runtime on PATH.
      # Plugin contribution tests invoke the host `node` executable directly.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # 3.11 is what the maintainer's venv runs; the ML pins in requirements.txt
      # are validated against it.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          # Do not restore pip cache on the self-hosted ARM runner: the large
          # ML archive can time out before the test job starts.

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch: sentence-transformers pulls torch transitively and
          # the default index serves the CUDA build (~2.5 GB), which both blows
          # up install time and can fill the runner disk.
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt

      - name: Run backend tests
        env:
          PYTHONPATH: .
          # Empty, throwaway vault — never the real one.
          DIGITAL_BRAIN_VAULT_PATH: ${{ runner.temp }}/vault
          GNOSI_LOCAL_DATA: ${{ runner.temp }}/local_data
          GNOSI_FILES_PROVIDER: local
          # Closed port: makes the "no live backend" skips deterministic.
          GNOSI_BACKEND_URL: http://127.0.0.1:59999
        run: |
          mkdir -p "$DIGITAL_BRAIN_VAULT_PATH" "$GNOSI_LOCAL_DATA"
          python -m backend.agent.evals.runner --compact
          # `integrations` too: the connectors had no test gate at all, so a
          # change to the LibreOffice extension could not be caught by CI.
          # Its suite fakes the UNO modules, which only exist inside
          # LibreOffice, and runs in milliseconds.
          pytest backend/tests integrations -q --durations=10

      # Live HTTP tests are deliberately isolated from the normal hermetic
      # suite. They opt in explicitly, use a separate port and throwaway
      # directories, and can never accidentally mutate a native developer
      # backend or the maintainer's Vault.
      - name: Run isolated live E2E tests
        env:
          PYTHONPATH: .
          DIGITAL_BRAIN_VAULT_PATH: ${{ runner.temp }}/live-e2e-vault
          GNOSI_LOCAL_DATA: ${{ runner.temp }}/live-e2e-local-data
          GNOSI_FILES_PROVIDER: local
          GNOSI_REQUIRE_AUTH: "false"
          GNOSI_INDEX_WARMUP: "false"
          GNOSI_BACKEND_URL: http://127.0.0.1:59998
          GNOSI_RUN_LIVE_E2E: "1"
        run: |
          mkdir -p "$DIGITAL_BRAIN_VAULT_PATH/Assets" "$GNOSI_LOCAL_DATA"
          python -m uvicorn backend.server:app --host 127.0.0.1 --port 59998 --lifespan off > "$RUNNER_TEMP/gnosi-live-e2e.log" 2>&1 &
          backend_pid=$!
          trap 'kill "$backend_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if python -c 'import requests; raise SystemExit(0 if requests.get("http://127.0.0.1:59998/api/health", timeout=1).status_code == 200 else 1)' 2>/dev/null; then
              break
            fi
            sleep 1
          done
          python -c 'import requests; raise SystemExit(0 if requests.get("http://127.0.0.1:59998/api/health", timeout=2).status_code == 200 else 1)'
          pytest backend/tests/test_e2e_tables_assets.py backend/tests/test_vault_trash.py -q
