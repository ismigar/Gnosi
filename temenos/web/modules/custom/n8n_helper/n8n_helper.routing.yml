n8n_helper.add_translation:
  path: '/custom/translation-helper/add'
  defaults:
    _controller: '\Drupal\n8n_helper\Controller\TranslationController::addTranslation'
  methods: [POST]
  options:
    _auth: ['basic_auth', 'cookie']
  requirements:
    _permission: 'bypass content access control'
    _format: 'json'

n8n_helper.update_node:
  path: '/custom/node-helper/update'
  defaults:
    _controller: '\Drupal\n8n_helper\Controller\NodeController::updateNode'
  methods: [POST]
  options:
    _auth: ['basic_auth', 'cookie']
  requirements:
    _permission: 'bypass content access control'
    _format: 'json'
