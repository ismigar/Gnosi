# Drush commands services
services:
  notion_bridge.drush_commands:
    class: Drupal\notion_bridge\Drush\NotionBridgeCommands
    arguments:
      - '@notion_bridge.cleaner'
      - '@notion_bridge.sync_manager'
      - '@state'
      - '@date.formatter'
      - '@config.factory'
      - '@lock'
    tags:
      - { name: drush.command }

  notion_bridge.sync_manager:
    class: Drupal\notion_bridge\NotionBridgeSyncManager
    arguments:
      - '@entity_type.manager'
      - '@language_manager'
      - '@uuid'
      - '@keyvalue'
      - '@logger.channel.notion_bridge'
      - '@notion_bridge.notion_client'
      - '@notion_bridge.mapping_storage'
      - '@config.factory'
