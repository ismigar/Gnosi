# Adds a local tab under /admin/content for triggering manual Notion bridge.
notion_bridge.execute_tab:
  route_name: notion_bridge.execute         # Refers to the form at /admin/content/notion-bridge
  title: 'Notion bridge'                    # Tab title
  base_route: system.admin_content        # Attach the tab under the main Content admin page
  weight: 100                             # Push it to the bottom of the tab list

# Adds a top-level tab under /admin/config/notion-bridge (must match an existing base route)
notion_bridge.config_tab:
  route_name: notion_bridge.config          # Make sure this route exists and points to a config form
  title: 'Configuration'                  # Tab label
  base_route: notion_bridge.admin           # This route should wrap several tabs (e.g. /admin/config/notion-bridge)
  weight: 0                               # First tab in the group

# Adds a "bridge Status" tab under the same admin section
notion_bridge.status_tab:
  route_name: notion_bridge.status
  title: 'Bridge Status'
  base_route: notion_bridge.admin
  weight: 1
