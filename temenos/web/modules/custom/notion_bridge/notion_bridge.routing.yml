notion_bridge.config:
  path: '/admin/config/notion-bridge'
  defaults:
    _form: '\Drupal\notion_bridge\Form\NotionBridgeConfigForm'
    _title: 'Sincronització amb Notion'
  requirements:
    _permission: 'administer site configuration'
  options:
    _admin_route: TRUE

notion_bridge.execute:
  path: '/admin/content/notion-bridge'
  defaults:
    _form: '\Drupal\notion_bridge\Form\NotionBridgeExecutionForm'
    _title: 'Notion bridge'
  requirements:
    _permission: 'bridge Notion content'
  options:
    _admin_route: TRUE

notion_bridge.status:
  path: '/admin/content/notion-bridge/status'
  defaults:
    _controller: '\Drupal\notion_bridge\Controller\NotionBridgeController::status'
    _title: 'Notion Bridge Status'
  requirements:
    _permission: 'administer site configuration'
  options:
    _admin_route: TRUE

notion_bridge.clear:
  path: '/admin/config/content/notion-bridge/clear'
  defaults:
    _form: '\Drupal\notion_bridge\Form\NotionBridgeClearForm'
    _title: 'Clear Notion Bridge cache'
  requirements:
    _permission: 'administer site configuration'

