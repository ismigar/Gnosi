{% extends "base.html" %}
{% block styles %}
{{ super() }}
<style>
  .learn-navigation { display:flex; flex-wrap:wrap; align-items:center; gap:.45rem 1rem; margin-bottom:1.5rem; font-size:.75rem; }
  .learn-navigation a { padding:.45rem .15rem; }
  .learn-navigation [aria-current] { font-weight:700; border-bottom:2px solid currentColor; }
  .learn-navigation .learn-home { margin-inline-end:auto; }
  .md-typeset h1 { font-weight:700; letter-spacing:-.025em; color:var(--md-default-fg-color); }
  .md-typeset .grid.cards > ul > li { border-radius:.6rem; }
  .md-typeset li + li { margin-top:.6em; }
  a:focus-visible { outline:2px solid var(--md-accent-fg-color); outline-offset:3px; }
</style>
{% endblock %}
{% block content %}
<nav class="learn-navigation" aria-label="{{ config.extra.language_label }}">
  <a class="learn-home" href="{{ config.extra.website_path }}">← {{ config.extra.website_label }}</a>
  {% for code, name in config.extra.languages.items() %}
    <a href="{{ config.extra.learn_root }}{% if code != 'en' %}{{ code }}/{% endif %}{{ page.url if page else '' }}"
       lang="{{ code }}" hreflang="{{ code }}" data-learn-language
       {% if code == config.extra.locale %}aria-current="true"{% endif %}>{{ name }}</a>
  {% endfor %}
</nav>
{{ super() }}
{% endblock %}
{% block scripts %}
{{ super() }}
<script>
  // Stable section IDs are shared by translations, including direct article links.
  document.querySelectorAll('[data-learn-language]').forEach(function (link) {
    link.addEventListener('click', function () {
      const destination = new URL(link.href);
      destination.search = window.location.search;
      destination.hash = window.location.hash;
      link.href = destination.href;
    });
  });
</script>
{% endblock %}
